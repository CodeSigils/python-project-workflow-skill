name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gh reads GH_TOKEN from the environment and --verify-tag needs only
          # `git ls-remote`, which works unauthenticated here, so the write-scope
          # job has no reason to leave a usable token in .git/config.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag format, version metadata, and main ancestry
        run: |
          python3 scripts/check-version-consistency.py --expected-tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{}" origin/main

  release:
    needs: verify-release-tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
