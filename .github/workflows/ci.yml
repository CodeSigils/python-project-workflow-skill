name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Off the hour: Monday 09:00 UTC is GitHub's peak scheduled-load window.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.7"

jobs:
  validate:
    name: Validate skill source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Tags are the subject of check-version-consistency.py. The default
          # shallow clone has none, so the check silently passes without
          # comparing anything.
          fetch-depth: 0
          persist-credentials: false
        with:
          # Tags are the subject of check-version-consistency.py. The default
          # shallow clone has none, so the check silently passes without
          # comparing anything.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Check cross-agent portability
        run: python3 .github/scripts/check-portability.py

      - name: Check version consistency
        run: python3 scripts/check-version-consistency.py

      - name: Check README tree matches tracked files
        run: python3 scripts/check-readme-tree.py
      - name: Check expired freshness markers
        run: python3 scripts/check-expiry.py
      - name: Validate CI policy
        run: python3 scripts/validate-ci.py

      - name: Run skill source checks
        run: python3 scripts/validate.py

      - name: Test CI policy validation
        run: python3 scripts/test-validate-ci.py

      - name: Test payload sync behavior
        run: python3 scripts/test-sync-payload.py

      - name: Test behavioral regression fixtures
        run: python3 scripts/run-codex-regression.py --self-test

      - name: Test Hermes behavioral regression fixtures
        run: python3 scripts/run-hermes-regression.py --self-test

      - name: Test behavioral regression grader
        run: python3 scripts/grade-codex-regression.py --self-test

      - name: Payload sync check
        run: bash scripts/sync-payload.sh --ci

      - name: Ruff check scripts
        run: uv run --locked ruff check scripts .github/scripts

      - name: Shell script lint
        run: shellcheck scripts/*.sh .githooks/*

  verify-urls:
    name: Verify external references
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Verify referenced URLs
        run: python3 scripts/verify-urls.py

  release-integrity:
    name: Verify published release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The tag comparison needs real history: a default shallow clone has
          # no tags, and the version check would silently pass on nothing.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the latest tag has a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-version-consistency.py --require-github-release
