version: 2
updates:
  # Both checkout and setup-python are pinned by full commit SHA. A SHA pin
  # never rots on its own: nothing warns that the tag it points at has moved,
  # so an action can sit on a stale commit indefinitely unless a tool updates
  # it. Dependabot rewrites both the SHA and the trailing version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      routine-actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    # A major bump of a SHA-pinned action is a migration, not maintenance.
    # Both actions below are pinned to revisions that CI exercises on every
    # push, and moving to a new major means trusting an untested revision with
    # no evidence that it behaves the same. Taking those as routine produces
    # an open pull request per action per week, and an unmerged one is a
    # branch that persists and a base that drifts. They are therefore declined
    # here and taken deliberately, with CI as the evidence.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]

  # Ruff is the only dependency, and it is pinned in uv.lock rather than in a
  # workflow string. That distinction matters: Dependabot has no ecosystem for
  # a bare `env: RUFF_VERSION` value, so a linter pin kept there is invisible
  # to every update mechanism and only ever changes by hand.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"