changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [fix, bug]
    - title: Maintenance
      labels: [chore, documentation, dependencies]
    - title: Other changes
      labels: ['*']
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
